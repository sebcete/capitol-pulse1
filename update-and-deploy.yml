name: Update Capitol Pulse and publish
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 02 * * *' # ~10:17pm Eastern summer / 9:17pm winter; after market close
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: capitol-pulse-deploy
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Retrieve filings and price history
        run: python scripts/update.py
      - name: Save successful daily snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data.json
          git diff --cached --quiet || (git commit -m 'Refresh public disclosures and hypothetical returns [skip ci]' && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
