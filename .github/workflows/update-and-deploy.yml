name: Update Capitol Pulse and publish
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 02 * * *' # ~10:17pm Eastern summer / 9:17pm winter; after market close
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: capitol-pulse-deploy
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify application scripts and return calculations
        run: |
          node --check site/app.js
          node --check site/sw.js
          python -m unittest discover -s scripts -p 'test_*.py'
      - name: Retrieve filings and price history
        run: python scripts/update.py
      - name: Validate dataset before publishing
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          data = json.loads(Path('site/data.json').read_text(encoding='utf-8'))
          trades = data.get('trades', [])
          prices = data.get('prices', {})
          newest = datetime.fromisoformat(data['generatedAt'].replace('Z', '+00:00'))
          assert newest.tzinfo is not None and datetime.now(timezone.utc) - newest < timedelta(days=1), 'Snapshot generation date is stale'
          assert len(trades) >= 50, 'Disclosure feed is unexpectedly small'
          assert {'House', 'Senate'}.issubset(set(data.get('coverage', {}).get('chambers', []))), 'House or Senate records missing'
          assert isinstance(prices, dict) and len(prices) >= 20, 'Market price coverage too small'
          priced = [t for t in trades if t.get('type') == 'buy' and isinstance(t.get('returnPct'), (int, float))]
          assert len(priced) >= 20, 'Too few priced purchases to calculate rankings'
          assert all(t.get('filedDate') and t.get('tradeDate') for t in trades), 'Missing disclosure dates'
          print(f"Snapshot verified: {len(trades)} filings, {len(prices)} priced tickers, {len(priced)} measurable purchases")
          PY
      - name: Save successful daily snapshot
        if: github.event_name != 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data.json
          git diff --cached --quiet || git commit -m 'Refresh public disclosures and hypothetical returns [skip ci]'
          if [ -n "$(git log -1 --format=%s | grep '^Refresh public disclosures' || true)" ]; then
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
